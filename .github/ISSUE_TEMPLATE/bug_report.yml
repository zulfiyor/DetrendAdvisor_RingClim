name: Bug report
description: Report a reproducible bug in Detrend Advisor, RingClim, or their connected workflow.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please include enough detail to reproduce the issue.
  - type: dropdown
    id: app_scope
    attributes:
      label: Affected application/workflow
      options:
        - detrend_advisor.py (standalone)
        - ringclim.py (standalone)
        - Connected workflow (Detrend Advisor -> RingClim prefill)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: "OS, Python version, install mode, and whether R/Rscript+dplR is available"
