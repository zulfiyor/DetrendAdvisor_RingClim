[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "detrendadvisor-ringclim-suite"
version = "0.1.0"
description = "Integrated desktop suite for dendrochronological detrending advice, chronology export, and tree-ring climate correlation analysis."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Dr Zulfiyor Bakhtiyorov" }
]
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
